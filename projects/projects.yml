- title: Survival-Predicition-using-Autoencoder-and-AFT
  path: https://github.com/Sal4321/Survival-Predicition-using-Autoencoder-and-AFT-
  # Photo by Adrien Delforge on Unsplash  https://unsplash.com/photos/man-in-black-long-sleeve-shirt-and-black-pants-standing-on-shopping-cart-CrHG_ZYn1Dw
  image: images/autoencoder.png
  description: >
    The goal of this project is to predict survival times of patients using gene
    expression features and clinical features. We will see if the gene expression features has any
    significance in predicting overall survival. For the 1st part of our projcet,
    we are aiming to reduce the dimensionality of our gene-expression dataset which has been extracted
    from http://www.linkedomics.org/. The RNA-Seq data has 528 samples and 4571 features. For dimensionality reduction we will be using standard,
    denoisng and variational Autoencoder, which are a special type of neural network. After the feature reduction, we will use reduced feature in our clinical dataset
    and evaluate the effectiveness of predictions.
  categories: [Python, Dimentionality Reduction, Survival Analysis]
  date: 2020-04-01

- title: Street Sign Classification using CNN
  path: https://github.com/nazmussalehin93/Street-Number-classification-with-CNN
  image:
  description: >
    Capstone project of Coursera Getting Started with Tensorflow 2 Objective: Goal was to classfy street sign
    images captured from satellite. Size of the data: Train data has 73257 images and test data has
    Preprocessing of the data: The dataset is in .mat format. I converted the rgb image to grayscale image.
    Then normalized the image. Using Neural Network for classification: For Neural Network I used 2 hidden layers,
    1 input and output layer. 32 by 32 image are converted to 512 and 256 dimensional layers and finally 11 dimensional
    output layer (For digit 0 to 10).For CNN I used Conv2D, Dropout, Batch Normalization layer etc. I was able to achieve 89% accuracy with only 10 epochs, a much higher accuracy than ann (74%). Only drawback is CNN took a higher training time.
  categories: [Python, CNN]
  date: 2020-05-01


